<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
英会話フラッシュカード
</title>


<style>


:root{

--bg:
linear-gradient(
135deg,
#fff0f7,
#eef8ff
);

--card:
#ffffff;

--main:
#8b5cf6;

--sub:
#f9a8d4;

--text:
#374151;

}



*{

box-sizing:border-box;

}



body{

margin:0;

padding:0;

min-height:100vh;

font-family:

-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;


background:

var(--bg);


display:flex;

justify-content:center;

align-items:center;

}



.container{

width:100%;

max-width:650px;

min-height:100vh;

padding:8px;

display:flex;

flex-direction:column;

}




/* =========================
設定パネル
========================= */


.settings-panel{

background:white;

border-radius:22px;

padding:12px;

box-shadow:

0 8px 20px
rgba(0,0,0,.08);

margin-bottom:8px;

}



.setting-row{

display:flex;

justify-content:space-between;

align-items:center;

margin:8px 0;

font-size:15px;

font-weight:bold;

}



select,
input{

border:0;

background:#f3f4f6;

padding:8px;

border-radius:12px;

font-size:15px;

}





/* =========================
3Dカード
========================= */


.card-wrapper{

flex:1;

perspective:1200px;

}



.card{

width:100%;

height:75vh;

max-height:760px;

position:relative;

transform-style:preserve-3d;

transition:

transform .8s
cubic-bezier(.4,0,.2,1);

}



.card.flipped{

transform:

rotateY(180deg);

}





.card-face{

position:absolute;

inset:0;

backface-visibility:hidden;

border-radius:35px;

background:white;

box-shadow:

0 15px 40px
rgba(0,0,0,.15);


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:25px;

}




.card-front{

background:

linear-gradient(

160deg,

#ffffff,

#fff1f8

);

}



.card-back{

transform:

rotateY(180deg);


background:

linear-gradient(

160deg,

#ffffff,

#effbff

);

}





/* =========================
イラスト
========================= */


.illustration{

width:70%;

height:200px;

border-radius:30px;

background:#faf5ff;


display:flex;

align-items:center;

justify-content:center;


font-size:90px;


margin-bottom:20px;

}





/* =========================
文字
========================= */


.phrase{

font-size:

clamp(
45px,
10vw,
90px
);


font-weight:900;


color:#7c3aed;


text-align:center;


line-height:1.1;


word-break:break-word;

}



.meaning{

font-size:

clamp(
28px,
6vw,
45px
);


font-weight:bold;


color:#2563eb;


text-align:center;

}



.note{

font-size:18px;


color:#6b7280;


margin-top:20px;


text-align:center;

}

<!-- =========================
バッジ
========================= -->


.badges{

position:absolute;

top:20px;

display:flex;

gap:10px;

}



.badge{

background:#fce7f3;

padding:8px 15px;

border-radius:20px;

font-weight:bold;

}





/* =========================
ボタン
========================= */


.controls{

display:flex;

gap:10px;

margin-top:10px;

}



button{

flex:1;

border:none;

border-radius:18px;

padding:15px;

background:#8b5cf6;

color:white;

font-weight:bold;

font-size:16px;

}
  
/* 音声ボタンを小さくする */
.card-front button {
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 12px;
}



.auto{

background:#10b981;

}



.auto.active{

background:#ef4444;

}





.count{

text-align:center;

margin-top:8px;

font-size:16px;

color:#6b7280;

}




@media(max-width:600px){


.card{

height:78vh;

}


}



/* iPhone 画面で設定パネルがはみ出さないようにする */
.settings-panel {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
}

/* 設定項目を縦並びにしてはみ出し防止 */
.setting-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
}

/* 入力欄をスマホ幅に合わせる */
.settings-panel input,
.settings-panel select {
    width: 100%;
    max-width: 100%;
}

/* スマホでボタンがはみ出さないように縦並びにする */
@media (max-width: 600px) {
    .controls {
        flex-direction: column;
    }

    .controls button {
        width: 100%;
    }
}

/* 新規追加フォームをスマホで縦並びにする */
@media (max-width: 600px) {
    .setting-row input {
        width: 100%;
    }
}

/* 音声ボタンを小さくする */
.card-front button {
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 12px;
}

  

</style>


</head>

</div>

<div class="controls">

<button

▶ 自動再生

</div>




<div class="count" id="countInfo">

let currentIndex = 0;

let filteredCards = [...cards];

let autoPlay = false;

let autoTimer = null;



const card =
document.getElementById("card");

const phrase =
document.getElementById("phrase");

const meaning =
document.getElementById("meaning");

const frontImage =
document.getElementById("frontImage");

const backImage =
document.getElementById("backImage");

const note =
document.getElementById("note");

const ageBadge =
document.getElementById("ageBadge");

const typeBadge =
document.getElementById("typeBadge");

const countInfo =
document.getElementById("countInfo");





function showCard(){


if(filteredCards.length===0){

phrase.textContent="データなし";

meaning.textContent="";

return;

}


let c =
filteredCards[currentIndex];


phrase.textContent =
c.english;


meaning.textContent =
c.japanese;


frontImage.textContent =
c.image;


backImage.textContent =
c.image;


note.textContent =
c.note;


ageBadge.textContent =
c.age;


typeBadge.textContent =
c.type;



countInfo.textContent =

(currentIndex+1)
+
" / "
+
filteredCards.length;



card.classList.remove("flipped");


}







function nextCard(){


if(filteredCards.length===0)
return;


currentIndex++;


if(currentIndex >= filteredCards.length){

currentIndex=0;

}


showCard();


}





function prevCard(){


if(filteredCards.length===0)
return;


currentIndex--;


if(currentIndex < 0){

currentIndex =
filteredCards.length-1;

}


showCard();


}







card.addEventListener(
"click",
()=>{

card.classList.toggle("flipped");

}

);








function speakPhrase(e){


if(e){

e.stopPropagation();

}


let text =
filteredCards[currentIndex].english;


let speech =
new SpeechSynthesisUtterance(text);


speech.lang="en-US";

speech.rate=0.8;


speechSynthesis.cancel();

speechSynthesis.speak(speech);


}








function toggleAutoPlay(){


let btn =
document.getElementById("autoBtn");



autoPlay =
!autoPlay;



if(autoPlay){


btn.classList.add("active");

btn.textContent =
"■ 停止";



autoTimer =
setInterval(()=>{


speakPhrase();


setTimeout(()=>{

nextCard();

},2500);



},4000);



}

else{


btn.classList.remove("active");


btn.textContent =
"▶ 自動再生";


clearInterval(autoTimer);


}


}









function filterCards(){


let age =
document.getElementById("ageSelect").value;


let type =
document.getElementById("typeSelect").value;



filteredCards =
cards.filter(c=>{


let ageOK =
age==="all" ||
c.age===age;



let typeOK =
type==="all" ||

(type==="word" && c.type==="単語") ||

(type==="phrase" && c.type==="短文");



return ageOK && typeOK;


});



currentIndex=0;


showCard();


}







document
.getElementById("ageSelect")
.addEventListener(
"change",
filterCards
);



document
.getElementById("typeSelect")
.addEventListener(
"change",
filterCards
);





showCard();

}

card.classList.toggle("flipped");

card.addEventListener(
"touchstart",
function(e){

touchStartX =
e.changedTouches[0].screenX;


}
);



card.addEventListener(
"touchend",
function(e){


let touchEndX =
e.changedTouches[0].screenX;


let diff =
touchEndX-touchStartX;



if(Math.abs(diff)>50){


if(diff<0){

nextCard();

}
else{

}


}


}
